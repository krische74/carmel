[project]
name = "carmel"
version = "0.1.0"
description = "Carmel — automated personal investing platform"
requires-python = ">=3.12"
dependencies = [
    # Core data & computation
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",

    # Configuration
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",

    # Market data (free tier)
    "yfinance>=0.2.36",
    "fredapi>=0.5.2",

    # Database & storage
    "duckdb>=1.0",
    "pyarrow>=15.0",

    # API framework
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27",

    # Scheduling
    "apscheduler>=3.10",

    # Broker
    "alpaca-py>=0.28",

    # Dashboard
    "streamlit>=1.32",
    "plotly>=5.19",

    # Reporting
    "quantstats>=0.0.64",

    # Logging
    "python-json-logger>=2.0",

    # HTTP
    "httpx>=0.27",
]

[project.scripts]
carmel = "src.automation.runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]
ml = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.45",
]
fundamental = [
    "edgartools>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"src/dashboard/pages/*.py" = ["N999"]  # Streamlit multi-page ordering uses numeric filename prefixes
"src/dashboard/charts.py" = ["TC002"]  # Plotly Figure used at runtime in apply_hub_layout
"src/api/**/*.py" = ["B008", "TC001", "TC002"]  # FastAPI Depends() defaults; runtime annotations for DI
"src/risk/ml_order_gate.py" = ["TC001"]  # Signal used in runtime list[Signal] annotations
"tests/unit/api/**/*.py" = ["TC001", "TC002", "TC003"]  # TestClient/fixtures need runtime imports
"tests/unit/automation/test_scheduler_timezone.py" = ["TC002", "TC003"]
"tests/unit/automation/test_workflows_tier25.py" = ["TC002"]
"tests/unit/ml/test_retraining.py" = ["TC003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/dashboard/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
